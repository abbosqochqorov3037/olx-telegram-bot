name: OLX E'lon Tarqatuvchi

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Loyihani yuklash
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: E'lonlarni tarqatish
        run: python distribute.py
